# Toolbox preservation snapshot: 2026-10-15
# Target: Linux x86_64 (linux-64), glibc >= 2.28; Python 3.12.3.
# Recreate with Conda/Miniforge installed and network access:
#   CONDA_CHANNEL_PRIORITY=flexible conda env create -f masters-env.yaml
#   conda activate toolbox
# Source package versions are retained; Conda builds/channels are pinned to a
# successfully solved package set. git and bc are added for installation/scripts.
# surfaxe is intentionally editable to preserve its upstream CLI subpackages.
# Keep its automatically downloaded source checkout with the new environment.
# Git sources are pinned to full commits, including both customized VASPUP tools.
# vaspup2 owns generate-converge/data-converge, matching the original PATH order.
# Legacy versions remain available as vaspup1-generate-converge/data-converge.
# VASP binaries, licensed POTCAR datasets, external ~/bin tools and HPC modules
# are not Conda packages and must be transferred/configured separately.
# Set VASP_POTENTIALS to your licensed potential directory after restoration.
# The preserved mpi4py/MPICH stack is generic; use the destination HPC's supported
# MPI integration for production multi-node jobs. No source-host paths are set.
name: toolbox
